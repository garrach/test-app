name: DevOps Pipeline Test (Optimized)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  devops-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      # ✅ Cache node_modules directly
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Simulate DevOps-Core
        run: echo "DevOps-Core completed"

  staging-deploy:
    needs: devops-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Simulate Staging Deployment
        run: echo "Staging deployment completed"

  production-deploy:
    needs: staging-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Simulate Production Deployment
        run: echo "Production deployment completed"

  post-deploy-validations:
    needs: production-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Post-Deploy Validation
        run: echo "Post-deploy validations passed"
