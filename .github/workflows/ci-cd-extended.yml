name: Simple DevOps Pipeline Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  devops-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

    staging-deploy:
    needs: devops-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Simulate Staging Deployment
        run: echo "Staging deployment step - dependencies installed successfully"

  production-deploy:
    needs: devops-core
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Simulate Production Deployment
        run: echo "Production deployment step - dependencies installed successfully"

  post-deploy-validations:
    needs: production-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Post-Deploy Validation
        run: echo "Post-deploy validations passed"
