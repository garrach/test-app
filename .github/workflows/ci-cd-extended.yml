jobs:
  devops-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Archive node_modules
        uses: actions/upload-artifact@v3
        with:
          name: node-modules
          path: node_modules

  staging-deploy:
    needs: devops-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/download-artifact@v3
        with:
          name: node-modules
          path: node_modules
      - name: Simulate Staging Deployment
        run: echo "Staging deployment step completed"

  production-deploy:
    needs: staging-deploy   # ✅ now depends on staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/download-artifact@v3
        with:
          name: node-modules
          path: node_modules
      - name: Simulate Production Deployment
        run: echo "Production deployment step completed"

  post-deploy-validations:
    needs: production-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Post-Deploy Validation
        run: echo "Post-deploy validations passed"
